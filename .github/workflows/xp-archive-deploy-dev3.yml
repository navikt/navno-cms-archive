name: Deploy XP archive to dev3 for Enonic XP Cloud PoC
on:
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment: dev-xp
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Build and deploy dev3
        uses: ./.github/actions/build-and-deploy-xp-archive
        with:
          naisEnv: dev
          varsFile: dev3.yml
          VITE_APP_ORIGIN: https://cms-arkiv-dev3.ansatt.dev.nav.no
          XP_ORIGIN: https://www-navpoc.enonic.cloud
          HTML_RENDER_API: http://nav-enonicxp-frontend-dev3/render-from-props
        env:
          READER_TOKEN: ${{ secrets.READER_TOKEN }}
          NAIS_WORKLOAD_IDENTITY_PROVIDER: ${{ secrets.NAIS_WORKLOAD_IDENTITY_PROVIDER }}
          NAIS_MANAGEMENT_PROJECT_ID: ${{ vars.NAIS_MANAGEMENT_PROJECT_ID }}
