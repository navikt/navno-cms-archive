name: Deploy XP archive to dev
on: workflow_dispatch

jobs:
  build:
    uses: navikt/navno-ci/.github/workflows/node-build.yml@v1
    permissions: { contents: read, id-token: write }
    with:
      github-environment: dev-xp
      image-suffix: dev
      dockerfile: Dockerfile_xp
      post-build-commands: pnpm --dir xp-archive run build
      prune-remove: ''
      pnpm-deploy: ./xp-archive/server nonsymlink/xp-server
      env-file-path: xp-archive/.env
      env-file: |
        NODE_ENV=production
        APP_PORT=3499
        APP_BASEPATH=/xp
        VITE_APP_ORIGIN=https://cms-arkiv.ansatt.dev.nav.no
        XP_ORIGIN=https://www.dev.nav.no
        HTML_RENDER_API=http://nav-enonicxp-frontend-dev1/render-from-props
    secrets: inherit

  deploy:
    needs: build
    uses: navikt/navno-ci/.github/workflows/nais-deploy.yml@v1
    permissions: { contents: read, id-token: write }
    with:
      cluster: dev-gcp
      resource: xp-archive/.nais/config.yml
      vars: xp-archive/.nais/vars/dev.yml
      var: image=${{ needs.build.outputs.image }}
