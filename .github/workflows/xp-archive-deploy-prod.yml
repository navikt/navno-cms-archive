name: Deploy XP archive to prod
on:
  push:
    branches: [main]

jobs:
  deploy:
    uses: ./.github/workflows/xp-archive-build-deploy-prod.yml
    permissions: { contents: read, id-token: write }
    secrets: inherit

  release:
    needs: deploy
    uses: navikt/navno-ci/.github/workflows/release.yml@v1
    permissions: { contents: write }
    with:
      image: ${{ needs.deploy.outputs.image }}
    secrets: inherit
