name: Deploy legacy archive
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - package*.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - legacy-archive/**/*
      - common/**/*

jobs:
  deploy:
    uses: ./.github/workflows/legacy-archive-build-deploy.yml
    permissions: { contents: read, id-token: write }
    secrets: inherit
